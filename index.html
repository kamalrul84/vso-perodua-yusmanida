<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vehicle Sales Order</title>
<meta name="theme-color" content="#EB0A1E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--red:#EB0A1E;--red-d:#B80716;--ink:#1A1A1A;--mut:#6B6F76;--line:#E3E5E8;--bg:#F4F5F7;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
header{background:var(--red);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
.wrap{max-width:1200px;margin:0 auto;padding:12px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}.wrap>*{min-width:0}

@media(max-width:899px){.wrap[data-v="form"] .pane-prev{display:none}.wrap[data-v="prev"] .pane-form{display:none}}
.tabs{display:flex;background:#fff;border-radius:12px;padding:4px;border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-weight:600;color:var(--mut);font-size:14px}
.wrap[data-v="form"] .tabs [data-t=form],.wrap[data-v="prev"] .tabs [data-t=prev]{background:var(--red);color:#fff}
.card{background:#fff;border-radius:var(--r);border:1px solid var(--line);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:14px;letter-spacing:.3px;color:var(--red-d);text-transform:uppercase}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.w{grid-column:1/-1}
.f label{font-size:12px;color:var(--mut);font-weight:600}
.f input,.f textarea,.f select{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--ink);width:100%;min-width:0}
.f input:focus,.f textarea:focus{outline:2px solid var(--red);border-color:transparent}
.f input.auto{background:#FAFAFB}
.f input.auto::placeholder{color:#111;opacity:.55}
.f .hint{font-size:11px;color:var(--mut)}
.f input.ov{border-color:var(--red)}
.accrow{display:grid;grid-template-columns:1fr 110px;gap:8px;margin-bottom:8px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:6}
.bar button{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 6px;font-size:14px;font-weight:700;white-space:nowrap;color:var(--ink)}
.bar button.p{background:var(--red);border-color:var(--red);color:#fff;flex:1.3}
.bar button.wa{background:#25D366;border-color:#25D366;color:#fff}
.stage{background:#D8DADE;border-radius:12px;padding:10px;overflow:hidden}
.stagebox{position:relative;margin:0 auto;overflow:hidden}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;display:none}
dialog{border:0;border-radius:16px;padding:0;width:min(92vw,460px);max-height:80vh}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dh{padding:14px 16px;font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.dl{overflow:auto;max-height:60vh}
.it{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.it div{flex:1;min-width:0}.it b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it small{color:var(--mut)}
.it button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font-weight:600}
.it button.d{color:var(--red)}
@media(min-width:900px){.wrap{grid-template-columns:minmax(380px,460px) minmax(0,1fr);align-items:start}.wrap>.tabs{display:none}.pane-prev{position:sticky;top:70px}}
/* ===== PAPER ===== */
.page{width:595.28pt;height:841.89pt;background:#fff;position:relative;transform-origin:0 0;color:#000;font-family:Calibri,Carlito,sans-serif;overflow:hidden}
.sheet{position:absolute;left:0;top:0;width:611.25pt;transform:scale(.8);transform-origin:0 0;display:grid;grid-template-columns:repeat(10,45.75pt) 62.25pt 45.75pt 45.75pt}
.sheet>*{min-width:0;min-height:0}
.c{display:flex;align-items:center;padding:0 3pt;font-size:10pt;white-space:nowrap;overflow:hidden}
.c.v{font-size:11pt}
.c.r{justify-content:flex-end}.c.m{justify-content:center}.c.top{align-items:flex-start;white-space:normal;padding-top:2pt}
.c.b{font-weight:700}.c.s8{font-size:8pt}.c.s9{font-size:9pt}.c.s11{font-size:11pt}.c.s12{font-size:12pt}
.bd{pointer-events:none}
.bb{border-bottom:.75pt solid #000}
.bt{border-top:.75pt solid #000}
.title{font-family:'Cooper Black','Cooper Std Black',Georgia,serif;font-size:22pt;font-weight:900;display:flex;align-items:center;justify-content:center;background:#595959;color:#fff}
.c.ov{overflow:visible}.c.l{justify-content:flex-start}.c.s10{font-size:10pt}.c.s14{font-size:14pt}.c.s18{font-size:18pt}
@media print{
 @page{size:A4;margin:0}
 html,body{background:#fff!important;padding:0!important}
 header,.wrap>.tabs,.pane-form,.bar,.toast,.stage-pad{display:none!important}
 .wrap{display:block!important;padding:0!important;max-width:none}
 .pane-prev{display:block!important;position:static!important}
 .stage{background:none!important;padding:0!important}
 .stagebox{width:auto!important;height:auto!important;overflow:visible!important}
 .page{transform:none!important;position:static!important}
}
</style>
</head>
<body>
<header><h1>Vehicle Sales Order</h1><button id="bList">Senarai</button><button id="bNew">Baru</button></header>
<div class="wrap" data-v="form" id="wrap">
 <div class="tabs"><button data-t="form">Isi</button><button data-t="prev">Pratonton</button></div>
 <div class="pane-form" id="form"></div>
 <div class="pane-prev"><div class="stage"><div class="stagebox" id="sbox"><div class="page" id="page"><div class="sheet" id="sheet"></div></div></div></div></div>
</div>
<div class="bar">

</div>
<div class="toast" id="toast"></div>
<dialog id="dlg"><div class="dh"><span>Order tersimpan</span><button id="dClose" style="border:0;background:none;font-size:18px">✕</button></div><div class="dl" id="dl"></div></dialog>
<script>
const $=s=>document.querySelector(s);
const DEF={sa:'KAMAL',satel:'012-434 8978',deliv:'A.S.A.P',rate:'6'};
/* form sections: [title, [id,label,type,span]] */
const SEC=[
['Pelanggan',[['cname','Nama pelanggan','t',1],['addr1','Alamat 1','t',1],['addr2','Alamat 2','t',1],['addr3','Alamat 3','t',1],['addr4','Poskod / bandar','t',1],['nric','No. NRIC','t'],['tel1','Tel','t'],['tel2','Tel (2)','t'],['telg','Tel (G)','t'],['off','Office','t'],['date','Tarikh','d'],['sa','Sales advisor','t'],['satel','Tel sales advisor','t']]],
['Butiran kenderaan',[['model','Model','t'],['desc','Description','t'],['engine','Engine no','t'],['cc','Engine C.C','t'],['chassis','Chassis no','t'],['stype','Sales type','t'],['colour','Colour','t'],['term','Term','t'],['deliv','Approximate delivery date','t',1]]],
['Struktur harga (RM)',[['net','Govt approved net selling price','n',1],['std','Govt approved standard accessories','n',1],['insp','Inspection fee','n'],['admin','Admin handling','n'],['plate','Number plate','n'],['metal','Metallic paint','n'],['opt','Optional accessories package gear up','n',1]]],
['Aksesori APA',null],
['Lain-lain',[['misc','Miscellaneous (RM)','n'],['less','Less / diskaun (RM)','n'],['rate','GST / cukai (%)','n'],['sst','Cukai barang & perkhidmatan','n'],['road','Road tax','n'],['regfee','Registration fees','n'],['hp','HP ownership','n'],['ins','Insuran premium','n']]],
['Finance',[['fyear','Made year','t'],['famt','Amount financed','n'],['fper','Finance period','t']]],
['Trade-in',[['ta_no','Appraisal number','t'],['ta_date','Appraisal date','d'],['ta_model','Model description','t',1],['ta_reg','Registration number','t'],['ta_ymf','Year manufactured','t'],['ta_yreg','Year registration','t'],['remark','*Remark','a',1]]],
['Bayaran',[['tradein','Trade-in price','n'],['hpset','HP settlement','n']]],
['Jumlah (auto, boleh ditulis ganti)',null]
];
const CALC=[['g23','Sub total'],['apa','APA total'],['g36','Sub total (misc + APA)'],['h39','Sub total tanpa GST'],['gst','GST'],['g42','Sub total dengan GST'],['g47','Total price with GST'],['g49','Purchase price'],['g52','Outstanding sum'],['g55','Total outstanding']];
const ACC=[1,2,3,4,5];
const N=v=>{const x=parseFloat(String(v==null?'':v).replace(/,/g,''));return isNaN(x)?0:x};
const R2=x=>Math.round((x+Number.EPSILON)*100)/100;
function calc(V){
 const o={};
 o.g23=N(V.net)+N(V.std);
 const pre=eff('g23',o,V)+N(V.insp)+N(V.admin)+N(V.plate)+N(V.metal)+N(V.opt);
 o.apa=ACC.reduce((s,i)=>s+N(V['acca'+i]),0);
 o.g36=eff('apa',o,V)+N(V.misc);
 o.h39=pre+eff('g36',o,V)-N(V.less);
 o.gst=R2(eff('h39',o,V)*N(V.rate)/100);
 o.g42=eff('h39',o,V)+eff('gst',o,V)+N(V.sst);
 o.g47=eff('g42',o,V)+N(V.road)+N(V.regfee)+N(V.hp)+N(V.ins);
 o.g49=eff('g47',o,V);
 o.g52=eff('g49',o,V);
 o.g55=eff('g52',o,V)-N(V.tradein)+N(V.hpset);
 for(const k in o)o[k]=R2(o[k]);
 return o;
}
function eff(k,o,V){return (V[k]!==undefined&&V[k]!=='')?N(V[k]):(o[k]||0)}
const fmt=x=>x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money=(v)=>(v===''||v==null)?'':fmt(N(v));
const dfmt=v=>{if(!v)return'';const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(v);return m?m[3]+'/'+m[2]+'/'+m[1]:v};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let V={};
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function fresh(){V=Object.assign({},DEF,{date:today()})}
function load(){try{const d=JSON.parse(LS.get('so-draft')||'null');if(d&&d.V){V=d.V;return}}catch(e){}fresh()}
function persist(){LS.set('so-draft',JSON.stringify({V}))}

/* ===== form ===== */
function buildForm(){
 let h='';
 for(const [t,fs] of SEC){
  h+='<div class="card"><h2>'+t+'</h2>';
  if(t==='Aksesori APA'){
   h+='<div class="hint" style="font-size:12px;color:var(--mut);margin-bottom:8px">Senarai aksesori (maks 5 baris). APA total dikira auto.</div>';
   for(const i of ACC)h+='<div class="accrow"><div class="f"><input data-k="acc'+i+'" placeholder="Aksesori '+i+'" autocomplete="off"></div><div class="f"><input data-k="acca'+i+'" data-n="1" inputmode="decimal" placeholder="RM"></div></div>';
  }else if(fs===null){
   h+='<div class="g">'+CALC.map(([k,l])=>'<div class="f"><label>'+l+'</label><input class="auto" data-k="'+k+'" data-c="1" inputmode="decimal"></div>').join('')+'</div>';
  }else{
   h+='<div class="g">';
   for(const [k,l,ty,sp] of fs){
    const w=(sp||ty==='a')?' w':'';
    if(ty==='a')h+='<div class="f'+w+'"><label>'+l+'</label><textarea rows="3" data-k="'+k+'"></textarea></div>';
    else h+='<div class="f'+w+'"><label>'+l+'</label><input data-k="'+k+'" '+(ty==='d'?'type="date"':ty==='n'?'inputmode="decimal" data-n="1"':'autocomplete="off"')+'></div>';
   }
   h+='</div>';
  }
  h+='</div>';
 }
 $('#form').innerHTML=h;
 document.querySelectorAll('#form [data-k]').forEach(el=>{
  el.addEventListener('input',()=>{V[el.dataset.k]=el.value;update(el)});
  if(el.dataset.n||el.dataset.c)el.addEventListener('blur',()=>{if(el.value!==''&&el.dataset.n)el.value=el.value.replace(/,/g,'')});
 });
}
function syncForm(skip){
 const o=calc(V);
 document.querySelectorAll('#form [data-k]').forEach(el=>{
  const k=el.dataset.k;
  if(el!==skip)el.value=V[k]==null?'':V[k];
  if(el.dataset.c){el.placeholder=fmt(o[k]||0);el.classList.toggle('ov',V[k]!==undefined&&V[k]!=='')}
 });
}

const ROWS=[];for(let r=1;r<=64;r++)ROWS[r]=15;
[7,8,9,10,11,12].forEach(r=>ROWS[r]=15.75);ROWS[13]=6;for(let r=20;r<=57;r++)ROWS[r]=17.25;ROWS[58]=15.75;
const SHEET_W=611.25,SHEET_H=ROWS.slice(1).reduce((a,b)=>a+b,0);
function area(r1,c1,r2,c2){return `grid-area:${r1}/${c1}/${r2+1}/${c2+1}`}
function cell(cls,r1,c1,r2,c2,txt,extra){return `<div class="${cls}" style="${area(r1,c1,r2,c2)};${extra||''}">${txt}</div>`}
const W={'':'.75pt solid #000',m:'1.5pt solid #000',d:'2.25pt double #000'};
function inMV(r,c){return MRG.some(m=>m[0]<=r&&r<=m[2]&&m[1]<c&&c<=m[3])}
function inMH(r,c){return MRG.some(m=>m[0]<r&&r<=m[2]&&m[1]<=c&&c<=m[3])}
function borders(){
 const Vv={},Hh={},rank=x=>x==='d'?3:x==='m'?2:1;
 const put=(o,k,w)=>{if(!o[k]||rank(w)>rank(o[k]))o[k]=w};
 for(const [r,c,f] of BRD){const m=f.match(/[lrtb][md]?/g);for(const e of m){const k=e[0],w=e.slice(1);
  if(k==='l')put(Vv,r+','+c,w);if(k==='r')put(Vv,r+','+(c+1),w);if(k==='t')put(Hh,r+','+c,w);if(k==='b')put(Hh,(r+1)+','+c,w);}}
 let h='';
 for(const k in Vv){const [r,c]=k.split(',').map(Number);if(inMV(r,c)||r===48)continue;h+=cell('bd',r,c>13?13:c,r,c>13?13:c,'',(c>13?'border-right:':'border-left:')+W[Vv[k]])}
 for(const k in Hh){const [r,c]=k.split(',').map(Number);if(inMH(r,c))continue;h+=cell('bd',r>64?64:r,c,r>64?64:r,c,'',(r>64?'border-bottom:':'border-top:')+W[Hh[k]])}
 return h;
}
function paper(){
 const o=calc(V);const A=k=>(V[k]!==undefined&&V[k]!=='')?money(V[k]):fmt(o[k]||0);
 const ms=k=>money(V[k]);
 let h=borders();
 const T=(cl,r1,c1,r2,c2,t)=>cell('c '+cl,r1,c1,r2,c2,t);

/* ===== scaling ===== */
function fit(){
 const box=$('#sbox'),st=box.parentElement;
 if(getComputedStyle(st).display==='none'||box.offsetParent===null)return;
 const W=st.clientWidth-20,pw=595.28*96/72,s=Math.min(1,W/pw);
 $('#page').style.transform='scale('+s+')';
 box.style.width=pw*s+'px';box.style.height=841.89*96/72*s+'px';
}
function update(skip){syncForm(skip);paper();persist();fit()}

/* ===== actions ===== */
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function makePdf(){
 if(!window.html2canvas)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
 if(!window.jspdf)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
 if(document.fonts&&document.fonts.ready)await document.fonts.ready;
 const host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0';
 const cl=$('#page').cloneNode(true);cl.style.transform='none';host.appendChild(cl);document.body.appendChild(host);
 try{
  const cv=await html2canvas(cl,{scale:3,backgroundColor:'#fff',useCORS:true});
  const pdf=new jspdf.jsPDF({unit:'pt',format:'a4',compress:true});
  pdf.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',0,0,595.28,841.89,undefined,'FAST');
  return pdf.output('blob');
 }finally{host.remove()}
}
const fname=()=>'SALES ORDER '+(V.cname||'').replace(/[^\w ]+/g,'').trim().toUpperCase().slice(0,30)+'.pdf';
async function share(){
 toast('Menyediakan PDF…');
 let blob;try{blob=await makePdf()}catch(e){toast('Gagal jana PDF (perlu internet)');return}
 const f=new File([blob],fname(),{type:'application/pdf'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){
  try{await navigator.share({files:[f],title:'Vehicle Sales Order'});return}catch(e){if(e.name==='AbortError')return}
 }
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;document.body.appendChild(a);a.click();a.remove();
 toast('PDF dimuat turun — lampirkan di WhatsApp');
 setTimeout(()=>window.open('https://wa.me/?text='+encodeURIComponent('Vehicle Sales Order'+(V.cname?' - '+V.cname:'')),'_blank'),700);
}
/* saved orders */
const getSaved=()=>{try{return JSON.parse(LS.get('so-saved')||'[]')}catch(e){return[]}};
function save(){
 const l=getSaved(),id=V._id||('o'+Date.now());V._id=id;
 const rec={id,name:V.cname||'(tanpa nama)',model:V.model||'',t:Date.now(),V:JSON.parse(JSON.stringify(V))};
 const i=l.findIndex(x=>x.id===id);if(i>=0)l[i]=rec;else l.unshift(rec);
 LS.set('so-saved',JSON.stringify(l.slice(0,100)));persist();toast('Disimpan');
}
function showList(){
 const l=getSaved();
 $('#dl').innerHTML=l.length?l.map(x=>'<div class="it"><div><b>'+esc(x.name)+'</b><small>'+esc(x.model)+' · '+new Date(x.t).toLocaleDateString('en-GB')+'</small></div><button data-o="'+x.id+'">Buka</button><button class="d" data-d="'+x.id+'">Padam</button></div>').join(''):'<div class="it"><div><small>Belum ada order disimpan.</small></div></div>';
 $('#dlg').showModal();
}
$('#dl').addEventListener('click',e=>{
 const o=e.target.dataset.o,d=e.target.dataset.d;
 if(o){const r=getSaved().find(x=>x.id===o);if(r){V=JSON.parse(JSON.stringify(r.V));V._id=r.id;update();$('#dlg').close();toast('Dibuka')}}
 if(d){if(confirm('Padam order ini?')){LS.set('so-saved',JSON.stringify(getSaved().filter(x=>x.id!==d)));showList()}}
});
$('#dClose').onclick=()=>$('#dlg').close();
$('#bList').onclick=showList;
$('#bNew').onclick=()=>{if(confirm('Kosongkan borang dan mulakan order baru?\n(Order yang belum disimpan akan hilang)')){fresh();update();scrollTo(0,0)}};
$('#bSave').onclick=save;
$('#bShare').onclick=share;
$('#bPrint').onclick=()=>{ $('#page').style.transform='';window.print();setTimeout(fit,300)};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{$('#wrap').dataset.v=b.dataset.t;setTimeout(fit,0);scrollTo(0,0)});
window.addEventListener('resize',fit);
window.addEventListener('beforeprint',()=>{$('#page').style.transform='none'});
window.addEventListener('afterprint',fit);
load();buildForm();update();
